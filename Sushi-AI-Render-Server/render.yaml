services:
  - type: web
    name: sushi-ai-server
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/app/version
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
