<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苏轼AI</title>
<style>
  html,body{margin:0;min-height:100%;background:#f5f7fa;color:#1b1f2a;font-family:system-ui,sans-serif}
  body{min-height:100vh;display:grid;place-items:center}.message{text-align:center;padding:24px;max-width:32rem}
  p{color:#6b7280;line-height:1.6}a{color:#3b6ff5}a[hidden]{display:none}
</style>
</head>
<body>
<div class="message"><h3 id="loaderTitle">正在打开工坊…</h3><p id="loaderDetail">正在恢复创作页面。</p><a href="/" target="_top" id="loaderBack" hidden>返回重新进入</a></div>
<script>
(function () {
  'use strict';
  const wrap = /*WORKSHOP_PAYLOAD*/{};
  let activePromise = null;
  window.__sushiReady = false;
  window.__sushiLoadError = '';
  function showError(message) {
    if (window.__sushiReady) return;
    window.__sushiLoadError = message;
    const title = document.getElementById('loaderTitle');
    const detail = document.getElementById('loaderDetail');
    const back = document.getElementById('loaderBack');
    if (title) title.textContent = '工坊未能打开';
    if (detail) detail.textContent = message;
    if (back) back.hidden = false;
  }
  function hexBytes(hex, size) {
    if (typeof hex !== 'string' || !new RegExp('^[0-9a-f]{' + (size * 2) + '}$', 'i').test(hex)) throw new Error('进入凭证无效，请返回重新进入。');
    return Uint8Array.from(hex.match(/../g), function (pair) { return parseInt(pair, 16); });
  }
  function base64Bytes(base64) {
    return Uint8Array.from(atob(base64), function (ch) { return ch.charCodeAt(0); });
  }
  async function post(url, body) {
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, 45000);
    try {
      const response = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: controller.signal });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '恢复登录失败，请返回重新进入。');
      return data;
    } finally { clearTimeout(timer); }
  }
  async function unlock(keyHex, ivHex) {
    if (activePromise) return activePromise;
    activePromise = (async function () {
      if (!window.crypto || !window.crypto.subtle) throw new Error('请使用 HTTPS 服务器地址打开工坊；电脑本机可用 localhost。');
      const keyBytes = hexBytes(String(keyHex || ''), 32);
      const iv = hexBytes(String(ivHex || wrap.iv), 12);
      const ciphertext = base64Bytes(wrap.ct);
      const tag = base64Bytes(wrap.tag);
      const combined = new Uint8Array(ciphertext.length + tag.length);
      combined.set(ciphertext); combined.set(tag, ciphertext.length);
      const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
      await post('/api/workshop/session', { ticket: wrap.k, key: keyHex });
      try {
        sessionStorage.removeItem('sushi_wrap_key');
        sessionStorage.removeItem('sushi_wrap_iv');
        sessionStorage.removeItem('sushi_wrap_ticket');
        history.replaceState(null, '', location.pathname + location.search);
      } catch (ignored) {}
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
      return true;
    })();
    try { return await activePromise; }
    catch (error) { activePromise = null; throw error; }
  }
  window.__sushiUnlock = function (key, iv) {
    return unlock(key, iv).catch(function (error) {
      showError(error.name === 'AbortError' ? '恢复登录超时，请返回后重试。' : (error.message || '解密失败，请返回重新进入。'));
      return false;
    });
  };
  // Parent→iframe unlock for Mobile Safari when hash/sessionStorage do not reach the loader.
  var parentUnlock = null;
  var parentUnlockWaiters = [];
  function takeParentUnlock() {
    return parentUnlock;
  }
  function waitParentUnlock(ms) {
    if (parentUnlock) return Promise.resolve(parentUnlock);
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        resolve(null);
      }, ms);
      parentUnlockWaiters.push(function (payload) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(payload);
      });
    });
  }
  window.addEventListener('message', function (event) {
    var data = event && event.data;
    if (!data || data.type !== 'sushi_wrap_unlock') return;
    if (data.ticket && wrap.k && String(data.ticket) !== String(wrap.k)) return;
    if (!data.key) return;
    parentUnlock = { key: String(data.key), iv: data.iv ? String(data.iv) : wrap.iv };
    var waiters = parentUnlockWaiters.splice(0, parentUnlockWaiters.length);
    for (var i = 0; i < waiters.length; i++) waiters[i](parentUnlock);
    window.__sushiUnlock(parentUnlock.key, parentUnlock.iv);
  });
  async function boot() {
    const early = takeParentUnlock();
    if (early) {
      try { if (await unlock(early.key, early.iv)) return; } catch (ignored) {}
    }
    const hash = location.hash.replace(/^#/, '').split('.');
    if (hash[0]) {
      try { if (await unlock(hash[0], hash[1] || wrap.iv)) return; } catch (ignored) {}
    }
    try {
      const key = sessionStorage.getItem('sushi_wrap_key');
      const ticket = sessionStorage.getItem('sushi_wrap_ticket');
      if (key && (!ticket || ticket === wrap.k)) {
        try { if (await unlock(key, sessionStorage.getItem('sushi_wrap_iv'))) return; } catch (ignored) {}
      }
    } catch (ignored) {}
    // Brief wait for late parent postMessage before calling unlock API.
    const fromParent = await waitParentUnlock(400);
    if (fromParent) {
      try { if (await unlock(fromParent.key, fromParent.iv)) return; } catch (ignored) {}
    }
    try {
      const data = await post('/api/workshop/unlock', { ticket: wrap.k });
      if (data.key) {
        await unlock(data.key, data.iv);
        return;
      }
      showError('未能取得解锁密钥，请返回后重新进入。');
    } catch (error) {
      // Definitive auth/ticket errors: surface soon. Network/cold-start may still get a native key.
      const msg = (error && error.message) || '';
      if (error && error.name === 'AbortError') {
        showError('恢复登录超时，请返回后重试。');
        return;
      }
      if (/未登录|凭证|过期|无权|封禁|验证邮箱|无效|用尽|401|403|404|请先登录|请返回/i.test(msg)) {
        showError(msg);
        return;
      }
      // Soft failure: keep waiting briefly for Android __sushiUnlock / parent postMessage.
      setTimeout(function () {
        if (!window.__sushiReady && !window.__sushiLoadError) {
          showError(msg || '工坊解锁失败，请返回重新进入。');
        }
      }, 8000);
    }
  }
  setTimeout(function () { showError('打开工坊超时，请返回后重新进入。'); }, 90000);
  boot().catch(function () { showError('工坊加载失败，请重新进入。'); });
})();
</script>
</body>
</html>
