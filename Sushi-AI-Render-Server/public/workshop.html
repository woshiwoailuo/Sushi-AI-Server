<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>苏轼AI · 工坊</title>
</head>
<body>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<div class="应用">

  <!-- 顶栏 -->
  <header class="顶栏">

    <div>
      <span class="标记" id="管理员入口">免费ai · 仅供娱乐 · 作者 苏轼</span>
      <h1 id="标题入口">AI 角色生成器</h1>
    </div>

    <div class="顶栏右侧">
      <button
        type="button"
        class="次按钮 顶栏操作"
        onclick="开关生成历史()"
      >生成历史</button>
      <button
        type="button"
        class="智能按钮 顶栏操作 黑字按钮"
        onclick="下载当前图片()"
      >
        下载图片
      </button>
      <div id="历史面板" class="历史面板" hidden>
        <div class="历史标题">
          <b>最近 6 张</b>
          <button type="button" class="文字钮" onclick="清空生成历史()">清空</button>
        </div>
        <div id="历史列表" class="历史列表"></div>
      </div>
    </div>

  </header>

  <main class="工作区">

    <form
      id="input"
      class="控制栏"
      onsubmit="return false;"
    >

      <div class="分区 重点">

        <div class="分区标题">
          <b>01 · 核心描述</b>
          <span>必填</span>
        </div>

        <label>
          请完整描述你想创造的角色

          <textarea
            id="角色描述"
            name="角色描述"
            rows="5"
            placeholder="文生图直接写人物。换背景时先贴照片，再写：背景换成雪山山峰，人物保持原样。"
          ></textarea>
        </label>

        <label>
          生图平台
          <select id="出图引擎" name="出图引擎">
            <option value="auto" selected>免费生图 · AI Horde</option>
            <option value="perchance">Perchance · 前往官网</option>
          </select>
        </label>

        <div class="核心操作">

          <button
            type="button"
            id="随机按钮"
            class="智能按钮 黑字按钮"
            onclick="开始随机生成()"
          >
            随机生成图片
          </button>

          <button
            type="button"
            id="生成按钮"
            class="直接生成按钮"
            onclick="开始生成()"
          >
            生成角色图片
          </button>

        </div>

        <div id="管理面板" class="分区" hidden>
          <div class="分区标题"><b>管理员</b><span>已解锁</span></div>
          <label>默认平台
            <select id="管理默认平台" onchange="保存默认平台(this.value, true)">
              <option value="auto">免费生图 · AI Horde</option>
              <option value="perchance">Perchance · 前往官网</option>
            </select>
          </label>
          <label class="换背景行">
            <input id="调试开关" type="checkbox" onchange="切换调试(this.checked)">
            <span>显示调试信息</span>
          </label>
          <label class="换背景行">
            <input id="显示图生图" type="checkbox" checked onchange="切换区块('图生图区', this.checked)">
            <span>显示图生图</span>
          </label>
          <label class="换背景行">
            <input id="显示问答" type="checkbox" checked onchange="切换区块('问答区', this.checked)">
            <span>显示AI问答</span>
          </label>
          <p id="失败原因" class="说明文字">失败原因：暂无</p>
          <p id="调试信息" class="说明文字" hidden></p>
        </div>

      </div>

        <input
          id="执行分类"
          name="执行分类"
          type="hidden"
          value=""
        >

        <div id="分类输出" class="隐藏输出"></div>

      <div class="隐藏输出">
        <input id="角色姓名" name="角色姓名" type="hidden" value="">
        <input id="身份职业" name="身份职业" type="hidden" value="">
        <input id="年龄阶段" name="年龄阶段" type="hidden" value="不指定">
        <input id="性别气质" name="性别气质" type="hidden" value="">
        <input id="脸部特征" name="脸部特征" type="hidden" value="">
        <input id="发型发色" name="发型发色" type="hidden" value="">
        <input id="体型特征" name="体型特征" type="hidden" value="">
        <input id="服装配饰" name="服装配饰" type="hidden" value="">
        <input id="表情情绪" name="表情情绪" type="hidden" value="">
        <input id="动作姿势" name="动作姿势" type="hidden" value="">
        <input id="场景环境" name="场景环境" type="hidden" value="">
        <input id="构图景别" name="构图景别" type="hidden" value="">
        <input id="镜头视角" name="镜头视角" type="hidden" value="">
        <input id="光线氛围" name="光线氛围" type="hidden" value="">
        <input id="色彩方案" name="色彩方案" type="hidden" value="">
        <input id="艺术风格" name="艺术风格" type="hidden" value="写实摄影，电影剧照，非卡通">
        <input id="补充细节" name="补充细节" type="hidden" value="">
        <input id="执行随机" name="执行随机" type="hidden" value="">
        <input id="安全英文" name="安全英文" type="hidden" value="">
        <div id="随机输出" hidden></div>
      </div>

      <details class="分区">
        <summary>中英互译 · 中文会先尝试翻译</summary>
        <label>
          中文
          <textarea
            id="中文译文"
            name="中文译文"
            rows="3"
            placeholder="中文对照。可从核心描述译入，或在此改完再译成英文。"
          ></textarea>
        </label>
        <label>
          英文 · 实际出图只走这里
          <textarea
            id="英文描述"
            name="英文描述"
            rows="4"
            placeholder="生成前会填入英文。核心描述无论中英文，出图都只用英文。"
          ></textarea>
        </label>
        <div class="核心操作">
          <button type="button" class="次按钮" onclick="复制英文描述()">复制英文</button>
          <button type="button" class="次按钮" onclick="复制中文描述()">复制中文</button>
        </div>
        <p id="翻译状态" class="说明文字"></p>
      </details>

      <details class="分区">

        <summary>高级参数 · 比例 / 数量 / 种子</summary>

        <div class="双列">

          <label>
            图像比例

            <select
              id="图像比例"
              name="图像比例"
            >
              <option value="512x512" selected>
                正方形 · 512 × 512 · 最快
              </option>
              <option value="768x768">
                正方形 · 768 × 768 · 更清晰
              </option>
              <option value="1024x1024">
                正方形 · 1024 × 1024
              </option>
              <option value="512x768">
                竖版 · 512 × 768
              </option>
              <option value="768x1024">
                竖版 · 768 × 1024
              </option>
              <option value="576x1024">
                竖版手机 · 576 × 1024
              </option>
              <option value="768x512">
                横版 · 768 × 512
              </option>
              <option value="1024x768">
                横版 · 1024 × 768
              </option>
              <option value="1024x576">
                横版宽屏 · 1024 × 576
              </option>
            </select>
          </label>

          <label>
            一次生成

            <select
              id="生成数量"
              name="生成数量"
            >
              <option value="1" selected>
                1张 · 最快
              </option>
              <option value="3">3张 · 三种不同结果</option>
              <option value="5">5张 · 五种不同结果</option>
              <option value="7">7张 · 七种不同结果</option>
            </select>
          </label>

          <label>
            引导强度

            <select
              id="引导强度"
              name="引导强度"
            >
              <option value="5">
                5 · 更快更自由
              </option>

              <option value="7" selected>
                7 · 均衡
              </option>

              <option value="9">
                9 · 更贴合描述
              </option>

              <option value="11">
                11 · 强约束
              </option>
            </select>
          </label>

          <label>
            随机种子

            <input
              id="随机种子"
              name="随机种子"
              type="text"
              inputmode="numeric"
              placeholder="留空则每次随机"
            >
          </label>

          <label class="通栏">
            负面提示

            <textarea
              id="负面提示"
              name="负面提示"
              rows="4"
            >低清晰度，模糊，失焦，错误解剖，多头，双头，三头，身体融合，多余手臂，多余腿，缺失手臂，缺失腿，手脚数量不对，三只手，三只腿，多余手指，缺失手指，畸形手部，重复肢体，扭曲五官，模糊脸，变形脸，五官错位，塑料皮肤，蜡像感，卡通，动漫，插画，数字绘画，儿童，未成年人，真实名人，电脑界面，文字，水印</textarea>
          </label>

        </div>

      </details>

      <input
        id="成人功能状态"
        name="成人功能状态"
        type="hidden"
        value="adult mode enabled; NSFW allowed; nudity and adult sexual content allowed; follow the core description literally; do not add clothes if described as nude; fictional consenting adults 18+"
      >

      <details id="图生图区" class="分区">
        <summary>图生图 / 换背景 · 粘贴即可</summary>
        <div class="翻译内容">
          <div
            id="贴图区"
            class="贴图区"
            tabindex="0"
            onclick="document.getElementById('参考图文件').click()"
          >
            <input
              id="参考图文件"
              type="file"
              accept="image/*"
              hidden
              onchange="读取参考图文件(this)"
            >
            <p>在此 Ctrl+V 贴图，或拖入 / 点击选图</p>
            <img id="参考图预览" alt="参考图预览" hidden>
          </div>
          <input
            id="参考图地址"
            name="参考图地址"
            type="hidden"
            value=""
          >
          <label class="换背景行">
            <input
              id="只换背景"
              type="checkbox"
              checked
              onchange="同步换背景强度()"
            >
            <span>只换背景，人物、衣服、姿势尽量保持原图</span>
          </label>
          <label>
            还原程度
            <select id="图生图强度" name="图生图强度">
              <option value="0.38">偏低 · 背景改动大，人物也可能变</option>
              <option value="0.52" selected>换背景推荐 · 尽量留人改景</option>
              <option value="0.68">偏高 · 更像整张原图</option>
              <option value="0.84">很高 · 几乎不改</option>
            </select>
          </label>
          <div class="核心操作">
            <button type="button" class="次按钮" onclick="清空参考图()">清除参考图</button>
          </div>
          <p id="图生图状态" class="说明文字"></p>
        </div>
      </details>

      <details id="问答区" class="分区" open>
        <summary>AI 对话</summary>
        <label>
          通道
          <select id="AI通道" onchange="对话通道已改()">
            <option value="auto" selected>自动抢答</option>
            <option value="turbo">Turbo</option>
            <option value="fast">快答</option>
            <option value="horde">Horde</option>
          </select>
        </label>
        <label class="换背景行">
          <input id="记忆开关" type="checkbox" checked onchange="切换记忆(this.checked)">
          <span>记忆</span>
        </label>
        <div id="对话列表" class="对话列表" aria-live="polite"></div>
        <div class="对话输入行">
          <textarea id="AI问题" rows="2" placeholder="输入想问的话…"></textarea>
          <button type="button" class="主按钮" id="对话发送钮" onclick="提问AI()">发送</button>
        </div>
        <div class="核心操作">
          <button type="button" class="次按钮" onclick="清空对话()">清空对话</button>
        </div>
      </details>


      <input
        id="执行生成"
        name="执行生成"
        type="hidden"
        value=""
      >

    </form>

    <section class="结果区">

      <div class="结果标题">

        <div>
          <span>生成结果</span>
          <h2>角色画廊</h2>
        </div>


      </div>

      <div id="状态提示" class="状态提示" role="status" aria-live="polite">

        <div class="状态图标">✦</div>

        <b>图片将在这里显示</b>

        <p>
          填写描述后生成，或点随机生成图片。
        </p>

      </div>

      <button type="button" id="取消生成按钮" class="次按钮" onclick="取消生成()" hidden>取消本轮生成</button>
      <div id="官方画廊" class="画廊" hidden></div>
      <div id="图像输出" class="画廊"></div>
      <div id="抢出备用" class="画廊" hidden></div>
      <div id="抢出探测" hidden></div>
      <p id="平台提示" class="平台提示">AI Horde · 免费共享算力，繁忙时需要排队</p>

      <article id="画面说明" class="画面说明">
        <span>当前画面描述</span>
        <h3 id="说明标题">当前画面</h3>
        <p id="说明中文">用中文写下人物、服装、动作和场景。</p>
        <p id="说明英文" class="说明英文"></p>
      </article>

    </section>

  </main>

  <footer class="页脚">
    联系邮箱
    <a href="mailto:sjdwukai2@qq.com">sjdwukai2@qq.com</a>
  </footer>

  <div class="手机底栏" role="group" aria-label="图片操作">
    <button type="button" class="次按钮" onclick="开关生成历史()">历史</button>
    <button type="button" class="次按钮" onclick="下载当前图片()">下载</button>
    <button type="button" class="次按钮" onclick="滚到对话()">对话</button>
    <button type="button" id="手机随机按钮" class="智能按钮 黑字按钮" onclick="开始随机生成()">随机生成</button>
    <button type="button" id="手机生成按钮" class="直接生成按钮" onclick="开始生成()">生成图片</button>
  </div>

</div>

<script>
  var 成人主题已开启 = false;
  var 正在生成图片 = false;
  var 出图令牌 = 0;
  var 当前出图令牌 = 0;
  var 正在执行分类 = false;
  var 引擎顺序 = ["perchance", "turbo", "flux-realism", "flux", "sana"];
  var 走备用线路 = false;
  var 本引擎已出张数 = 0;
  var 本轮已试引擎 = [];
  var 进度已报 = 0;
  var 进度成功 = 0;
  var 十八禁点击 = 0;
  var 十八禁行已开 = false;
  var 用户选定平台 = "auto";
  var 本轮胜出 = "";
  var 管理员已解锁 = false;
  var 管理员口令 = "我是小笨蛋哦哦";
  var 十八禁口令 = "我是小色狼哦哦";
  var 管理员点击 = 0;
  var 上次官方张数 = 0;
  var 本轮抢出 = false;
  var 抢出已定 = false;
  var 抢出目标张数 = 1;
  var 即将抢出 = false;
  var 预载描写 = [];
  var 正在预载 = false;
  var 预载图 = null;

  function 藏站点元素(el, 根) {
    if (!el) return;
    if (根 && (el === 根 || 根.contains(el))) return;
    el.style.setProperty("display", "none", "important");
    el.style.setProperty("visibility", "hidden", "important");
    el.style.setProperty("opacity", "0", "important");
    el.style.setProperty("pointer-events", "none", "important");
    el.style.setProperty("width", "0", "important");
    el.style.setProperty("height", "0", "important");
    el.setAttribute("hidden", "");
  }

  function 藏编辑钮() {
    var 根 = document.querySelector(".应用");
    var 根们 = [document];
    try {
      if (window.parent && window.parent !== window && window.parent.document) 根们.push(window.parent.document);
    } catch (e) {}
    var 藏选择 = "#minimalModeMenuBtn,#backToMinimalModeBtn,#menuBarEl,#headerButton,#header-button,[id*='minimalMode'],[id*='headerButton'],[class*='headerButton'],[class*='minimizedHeader']";
    var 样式文 = 藏选择 + "{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important}";
    var r = 0;
    for (r = 0; r < 根们.length; r++) {
      var d = 根们[r];
      try {
        if (d.head && !d.head.querySelector("[data-hide-pc]")) {
          var st = d.createElement("style");
          st.setAttribute("data-hide-pc", "1");
          st.textContent = 样式文;
          d.head.appendChild(st);
        }
      } catch (e) {}
      try {
        var 指定 = d.querySelectorAll(藏选择);
        var k = 0;
        for (k = 0; k < 指定.length; k++) 藏站点元素(指定[k], 根);
      } catch (e3) {}
      var 节点 = d.querySelectorAll("a, button, img, svg, div, span");
      var i = 0;
      var 宽 = (d.documentElement && d.documentElement.clientWidth) || 400;
      for (i = 0; i < 节点.length; i++) {
        var el = 节点[i];
        if (根 && d === document && (el === 根 || 根.contains(el))) continue;
        var 字 = String(el.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
        var 址 = String(el.getAttribute("href") || "").toLowerCase();
        var 类名 = "";
        try { 类名 = typeof el.className === "string" ? el.className : (el.className && el.className.baseVal) || ""; } catch (e4) {}
        var 名 = String(el.id || "") + " " + 类名 + " " + String(el.getAttribute("title") || "") + " " + String(el.getAttribute("aria-label") || "");
        if (字 === "edit" || 字 === "编辑" || 字 === "🛠️" || 址.indexOf("#edit") !== -1 || /headerButton|minimizedHeader|minimalMode|menuBarEl|perchance/i.test(名)) {
          藏站点元素(el, 根);
          continue;
        }
        try {
          var cs = d.defaultView.getComputedStyle(el);
          if (cs.position !== "fixed" && cs.position !== "sticky" && cs.position !== "absolute") continue;
          var rec = el.getBoundingClientRect();
          if (rec.top < 90 && rec.right > 宽 - 120 && rec.width <= 120 && rec.height <= 120 && rec.width >= 8) 藏站点元素(el, 根);
        } catch (e2) {}
      }
    }
  }



  document.addEventListener("DOMContentLoaded", function () {
    恢复成人主题状态();
    绑定贴图();
    藏编辑钮();
    setTimeout(藏编辑钮, 200);
    setTimeout(藏编辑钮, 800);
    setTimeout(藏编辑钮, 2000);
    try {
      new MutationObserver(function () { 藏编辑钮(); }).observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}
    刷新画面说明();
    预载一条();
    管理员已解锁 = false;
    var 入口 = document.getElementById("管理员入口");
    if (入口) 入口.addEventListener("click", 尝试管理员解锁);
    刷新管理员界面();
    十八禁行已开 = false;
    刷新十八禁开关();
    恢复上次创作();
    填入待用提示();
    载入记忆开关();
    var 平台框 = document.getElementById("出图引擎");
    if (平台框) {
      if (!平台框.value) 平台框.value = "auto";
      用户选定平台 = 平台框.value || "auto";
      平台框.addEventListener("change", function () {
        用户选定平台 = 平台框.value || "auto";
        保存默认平台(用户选定平台, true);
        本引擎已出张数 = 0;
        本平台成功 = 0;
        本平台失败 = 0;
        var 提示 = document.getElementById("分类状态");
        if (提示) 提示.textContent = 用户选定平台 === "auto"
          ? "AI Horde 免费共享算力，繁忙时需要排队。"
          : (用户选定平台 === "perchance" ? "将在 Perchance 官网生成。" : "已选定 AI Horde 免费生图。");
      });
    }
    var 对话框 = document.getElementById("AI通道");
    if (对话框) {
      对话框.addEventListener("change", function () {
        保存对话通道(对话框.value || "auto", true);
      });
    }
    var 核心 = document.getElementById("角色描述");
    var 英文 = document.getElementById("英文描述");
    var 中文 = document.getElementById("中文译文");
    [核心, 英文, 中文].forEach(function (框) {
      if (!框) return;
      框.addEventListener("input", function () {
        刷新画面说明();
        排队字段互译(框.id);
      });
    });

  async function 谷歌快译(原文, 目标) {
    var sl = 目标 === "zh" ? "en" : "zh-CN";
    var tl = 目标 === "zh" ? "zh-CN" : "en";
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl +
      "&tl=" + tl + "&dt=t&q=" + encodeURIComponent(原文);
    var resp = await fetch(url);
    if (!resp.ok) throw new Error("gtx " + resp.status);
    var data = await resp.json();
    return (data[0] || []).map(function (行) { return 行[0] || ""; }).join("").trim();
  }

  async function 调用开源翻译(原文, 目标) {
    原文 = String(原文 || "").trim().slice(0, 400);
    if (!原文) return "";
    try {
      var 快 = await 谷歌快译(原文, 目标);
      if (快) return 快;
    } catch (e) {}
    var url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(原文) +
      "&langpair=" +
      (目标 === "zh" ? "en|zh-CN" : "zh-CN|en");
    var resp = await fetch(url);
    var data = await resp.json();
    var 文本 = data && data.responseData && data.responseData.translatedText;
    if (!文本 || /MYMEMORY WARNING/i.test(文本)) throw new Error("翻译失败");
    return String(文本).trim();
  }

    var 核心 = document.getElementById("角色描述");

    if (!核心 || !英文框) {

    }
    var 原文 = (核心.value || "").trim();
    if (!原文) {
      设翻译状态("请先填写核心描述。");
      return "";
    }

    if (含中文(原文)) {
      if (中文框) 中文框.value = 原文;
      设翻译状态("按核心描述翻译英文…");
      try {
        var 译文 = await 调用开源翻译(原文, "en");
        英文框.value = 补换背景英文(译文);
        设翻译状态("已按核心描述译成英文并出图。");
        return 英文框.value.trim();
      } catch (错误) {
        console.error(错误);
        设翻译状态("翻译失败，请把英文写到英文框。");
        return (英文框.value || "").trim();
      }
    }

    英文框.value = 补换背景英文(原文);
    if (中文框 && (强制翻译 || !含中文(中文框.value || ""))) {
      try {
        中文框.value = await 调用开源翻译(原文, "zh");
      } catch (错误) {}
    }
    设翻译状态("核心描述已是英文，直接用于出图。");
    return 英文框.value.trim();
  }

  function 压缩参考图(dataUrl, 完成) {
    var 图 = new Image();

      var 最长 = 768;
      var 宽 = 图.width;
      var 高 = 图.height;
      if (宽 > 最长 || 高 > 最长) {
        var 比例 = Math.min(最长 / 宽, 最长 / 高);
        宽 = Math.round(宽 * 比例);
        高 = Math.round(高 * 比例);
      }
      var 画布 = document.createElement("canvas");
      画布.width = 宽;
      画布.height = 高;
      var ctx = 画布.getContext("2d");
      ctx.drawImage(图, 0, 0, 宽, 高);
      var 输出 = 画布.toDataURL("image/jpeg", 0.86);
      完成(输出 || dataUrl);
    };
    图.onerror = function () {
      完成(dataUrl);
    };

  }

  function 去掉方括号(文) {
    return String(文 || "").replace(/[\[\]\{\}]/g, " ").replace(/\s+/g, " ").trim();

  function 本地随机一对() {
    var 池 = [
      ["黄昏窗边的成年女人，写实照片", "photoreal photo of a fictional adult woman by a dusk window"],
      ["雨夜街道上的成年男人，电影感", "cinematic photoreal photo of a fictional adult man on a rainy night street"],
      ["两名成年人在暖光室内对视", "photoreal photo of two fictional adults facing each other in warm indoor light"],
      ["旧沙发上的成年女人，胶片质感", "film-look photoreal photo of a fictional adult woman sitting on an old sofa"],
      ["靠在车门边的成年男人，黄金时刻", "golden hour photoreal photo of a fictional adult man leaning on a car door"],
      ["厨房里忙碌的成年女人，纪实摄影", "documentary photoreal photo of a fictional adult woman cooking in a kitchen"],
      ["图书馆窗边读书的成年男人", "photoreal photo of a fictional adult man reading by a library window"],
      ["海边栈道上的成年女人，自然光", "photoreal photo of a fictional adult woman on a seaside boardwalk, natural light"],
      ["三名成年人站在一起的半身写实照", "photoreal half-body photo of three fictional adults standing together"]
    ];
    return 池[Math.floor(Math.random() * 池.length)];
  }
  function 本地随机描述() {
    return 本地随机一对()[0];
  }

  function 解析AI两行(回) {
    回 = 去掉方括号(回 || "");
    if (!回) return null;
    var 中文 = "";
    var 英文 = "";
    var 行 = 回.split(/\n+/);
    var i = 0;
    for (i = 0; i < 行.length; i++) {
      var 行文 = 行[i].replace(/^(ZH|EN|中文|英文)\s*[:：]\s*/i, "").trim();
      if (!行文 || !像画面描述(行文)) continue;
      if (!中文 && 含中文(行文)) 中文 = 行文;
      else if (!英文 && !含中文(行文)) 英文 = 行文;
    }
    中文 = 去重描述(中文);
    英文 = 只留英文(英文);
    if (!像画面描述(中文) || !像画面描述(英文)) return null;
    var 项 = new Object();
    项.中文 = 中文;
    项.英文 = 英文;
    return 项;
  }

  function 预载一条() {
    while (预载描写.length < 3) {
      var p = 本地随机一对();
      预载描写.push({ 中文: p[0], 英文: p[1] });
    }
  }

  function 取出预载() {
    var 项 = 预载描写.shift();
    if (!项) {
      var p = 本地随机一对();
      项 = new Object();
      项.中文 = p[0];
      项.英文 = p[1];
    }
    return 项;
  }

  function 像画面描述(文) {
    var t = String(文 || "");
    if (t.replace(/\s/g, "").length < 6) return false;
    if (/分类|产品|响应一样快|建议你|sort through|take the time|carefully sort|MYMEMORY|HTTP |需要完成|用户请求|不要重复|不要解释|Okay,? I need|the user's request|cannot be repeated|currently thinking|按这个格式/i.test(t)) return false;
    if (/\d\.\s*\d/.test(t) && (t.match(/\d/g) || []).length >= 8) return false;
    if (/女性[:：]\s*[\d.]+/.test(t) || /Woman:\s*[\d.]+/i.test(t)) return false;
    if (t.length > 160) return false;
    return true;
  }

  function 去重描述(文) {
    var s = String(文 || "").replace(/\s+/g, " ").trim();
    s = s.replace(/^(ZH|EN|中文|英文)\s*[:：]\s*/i, "");
    if (s.length >= 16) {
      var 半 = Math.floor(s.length / 2);
      var 前 = s.slice(0, 半).trim();
      var 后 = s.slice(半).trim();
      if (前 === 后) s = 前;
    }
    var 段 = s.split(/[。！？；;]+/);
    var 见 = new Object();
    var 出 = [];
    var i = 0;
    for (i = 0; i < 段.length; i++) {
      var p = 段[i].trim();
      if (!p) continue;
      var k = p.toLowerCase();
      if (见[k]) continue;
      见[k] = 1;
      出.push(p);
    }
    return 出.join("。");
  }

  function 只留英文(文) {
    return 去重描述(文).replace(/[\u4e00-\u9fff]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function 解析尺寸() {
    var 值 = (document.getElementById("图像比例") || {}).value || "512x512";
    var 段 = String(值).split("x");
    return {
      宽: Number(段[0]) || 768,
      高: Number(段[1]) || 768
    };
  }

  function 有参考图() {
    var 地址 = document.getElementById("参考图地址");
    return !!(地址 && (地址.value || "").trim());
  }

  var 历史键 = "角色生成器_生成历史";

  function 空列表() {
    return new Array();
  }

  function 读取生成历史() {
    try {
      var 原始 = localStorage.getItem(历史键);
      var 列表 = 原始 ? JSON.parse(原始) : 空列表();
      return Array.isArray(列表) ? 列表 : 空列表();
    } catch (e) {
      return 空列表();
    }
  }

  function 保存生成历史(列表) {
    try {
      var 裁 = 空列表();
      var i = 0;
      for (i = 0; i < 列表.length && i < 6; i++) 裁.push(列表[i]);
      localStorage.setItem(历史键, JSON.stringify(裁));
    } catch (e) {}
  }

  function 收入历史(地址) {
    if (!地址) return;
    if (地址.indexOf("http") !== 0 && 地址.indexOf("data:image") !== 0) return;
    var 旧 = 读取生成历史();
    var 列表 = 空列表();
    var i = 0;
    for (i = 0; i < 旧.length; i++) {
      if (旧[i] && 旧[i].u !== 地址) 列表.push(旧[i]);
    }
    var 项 = new Object();
    项.u = 地址;
    项.t = Date.now();
    列表.unshift(项);
    保存生成历史(列表);
    var 板 = document.getElementById("历史面板");
    if (板 && !板.hasAttribute("hidden")) 刷新历史面板();
  }

  function 开关生成历史() {
    var 板 = document.getElementById("历史面板");
    if (!板) return;
    if (板.hasAttribute("hidden")) 板.removeAttribute("hidden");
    else 板.setAttribute("hidden", "");
    if (!板.hasAttribute("hidden")) 刷新历史面板();
  }

  function 清空生成历史() {
    保存生成历史(空列表());
    刷新历史面板();
  }

  function 下载历史图片(序号) {
    var 全部 = 读取生成历史();
    var 项 = null;
    var i = 0;
    for (i = 0; i < 全部.length; i++) {
      if (i === 序号) 项 = 全部[i];
    }
    if (!项 || !项.u) {
      alert("这张图已经失效。");
      return;
    }
    var a = document.createElement("a");
    a.href = 项.u;
    a.download = "角色图.jpg";
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function 刷新历史面板() {
    var 区 = document.getElementById("历史列表");
    if (!区) return;
    区.textContent = "";
    var 列表 = 读取生成历史();
    if (!列表.length) {
      var 空 = document.createElement("p");
      空.className = "历史空";
      空.textContent = "还没有生成记录。出图后会自动出现在这里。";
      区.appendChild(空);
      return;
    }
    function 加一张(号) {
      if (号 >= 列表.length || 号 >= 6) return;
      var 项 = 列表[号];
      var 卡 = document.createElement("div");
      卡.className = "历史卡片";
      var 图 = document.createElement("img");
      图.alt = "历史图";
      var 钮 = document.createElement("button");
      钮.type = "button";
      钮.className = "次按钮";
      钮.textContent = "下载";
      钮.addEventListener("click", function () { 下载历史图片(号); });
      卡.appendChild(图);
      卡.appendChild(钮);
      区.appendChild(卡);
      var 下一步 = function () { 加一张(号 + 1); };
      图.addEventListener("load", 下一步);
      图.addEventListener("error", 下一步);
      if (项 && 项.u) 图.src = 项.u;
      else 下一步();
    }
    加一张(0);
  }

  function 监听画廊历史() {
    绑画廊历史(document.getElementById("图像输出"));
    绑画廊历史(document.getElementById("官方画廊"));
  }
  function 绑画廊历史(区) {
    if (!区 || 区.getAttribute("data-hist") === "1") return;
    区.setAttribute("data-hist", "1");
    function 收一张(图) {
      if (!图 || 图.getAttribute("data-in-hist") === "1") return;
      图.setAttribute("data-in-hist", "1");
      var 收 = function () {
        收入历史(图.currentSrc || 图.src);
      };
      if (图.complete && 图.naturalWidth) 收();
      else 图.addEventListener("load", 收);
    }
    var 现有 = 区.getElementsByTagName("img");
    var i = 0;
    for (i = 0; i < 现有.length; i++) 收一张(现有[i]);
    var 观察 = new MutationObserver(function () {
      var 图们 = 区.getElementsByTagName("img");
      var n = 0;
      for (n = 0; n < 图们.length; n++) 收一张(图们[n]);
    });
    观察.observe(区, { childList: true, subtree: true });
  }

  function 下载当前图片() {
    var 区 = document.getElementById("图像输出");
    var 官 = document.getElementById("官方画廊");
    var 图们 = [];
    if (区) 图们 = 区.getElementsByTagName("img");
    if ((!图们 || !图们.length) && 官) 图们 = 官.getElementsByTagName("img");
    if (!图们.length) {
      alert("还没有可下载的图片，请先完成生成。");
      return;
    }
    var i = 0;
    for (i = 0; i < 图们.length; i++) {
      var 地址 = 图们[i].currentSrc || 图们[i].src;
      if (!地址 || 地址.indexOf("http") !== 0 && 地址.indexOf("data:") !== 0) continue;
      收入历史(地址);
      var a = document.createElement("a");
      a.href = 地址;
      a.download = "角色图.jpg";
      a.target = "_blank";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  }

    管理员点击 += 1;

  }
