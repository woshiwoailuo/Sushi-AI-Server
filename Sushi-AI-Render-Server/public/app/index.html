<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>苏轼AI</title>
  <style>
    :root {
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #1B1F2A;
      --muted: #6B7280;
      --accent: #3B6FF5;
      --danger: #E11D48;
      --line: rgba(27,31,42,.08);
      --radius: 12px;
      --safe-t: env(safe-area-inset-top);
      --safe-b: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
    body { min-height: 100dvh; overflow: hidden; }
    button, input, textarea, select { font: inherit; color: inherit; }
    input, textarea, select { background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; width: 100%; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: rgba(59,111,245,.55); box-shadow: 0 0 0 3px rgba(59,111,245,.12); }
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
    .screen.on { display: flex; }
    .splash { align-items: center; justify-content: center; background: var(--bg); }
    .mark { width: 72px; height: 72px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 28px; }
    .splash h1 { margin-top: 20px; font-size: 28px; font-weight: 650; }
    .splash p { color: var(--muted); margin-top: 8px; font-size: 13px; }
    .auth { padding: calc(28px + var(--safe-t)) 24px calc(24px + var(--safe-b)); justify-content: flex-start; background: var(--bg); overflow: auto; -webkit-overflow-scrolling: touch; }
    .auth .brand { margin-bottom: 8px; padding-top: 12px; flex: 0 0 auto; }
    #authForm, #verifyForm { flex: 0 0 auto; padding-bottom: 28px; }
    .kicker { color: var(--muted); font-size: 13px; }
    .auth h2 { font-size: 32px; margin: 10px 0 8px; font-weight: 620; }
    .auth .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .btn { border: 0; border-radius: var(--radius); padding: 14px 18px; width: 100%; font-weight: 640; cursor: pointer; pointer-events: auto; position: relative; z-index: 2; }
    .btn-lime { background: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); margin-top: 10px; }
    .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 6px 0 12px; }
    .app { background: var(--bg); }
    .top { padding: calc(12px + var(--safe-t)) 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hello { font-size: 20px; font-weight: 620; }
    .muted { color: var(--muted); font-size: 13px; }
    .content { flex: 1; overflow: auto; padding: 8px 16px 110px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(27,31,42,.04); }
    .nav { position: absolute; left: 12px; right: 12px; bottom: calc(10px + var(--safe-b)); height: 64px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 8px 24px rgba(27,31,42,.08); }
    .nav button { background: none; border: 0; color: var(--muted); font-size: 12px; }
    .nav button.active { color: var(--accent); font-weight: 640; }
    .gen-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .gen-wrap iframe { flex: 1; width: 100%; border: 0; background: #fff; min-height: 0; }
    .paywall { margin: 40px 8px; text-align: center; }
    .paywall h3 { font-size: 22px; margin: 12px 0; }
    .hidden { display: none !important; }
    .profile dt { color: var(--muted); font-size: 12px; margin-top: 14px; }
    .profile dd { margin-top: 4px; font-size: 16px; }
    @media (min-width: 901px) {
      .gen-wrap { padding: 0 8px 96px; }
      .gen-wrap iframe { min-height: calc(100dvh - 140px); }
      .content.gen-wrap { max-width: none; }
    }
  </style>
</head>
<body>
  <section id="splash" class="screen splash on">
    <div class="mark">苏</div>
    <h1>苏轼AI</h1>
    <p>正经娱乐 · 角色馆与创作</p>
  </section>

  <section id="auth" class="screen auth">
    <div class="brand">
      <div class="kicker">苏轼AI</div>
      <h2 id="authTitle">登录</h2>
      <p class="sub">正经娱乐 · 工坊随时可进</p>
    </div>
    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label>显示名</label>
        <input id="displayName" autocomplete="nickname" placeholder="昵称" />
      </div>
      <div class="field">
        <label>邮箱</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@mail.com" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
      </div>
      <div class="field" id="pass2Field" style="display:none">
        <label>确认密码</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="再次输入密码" />
      </div>
      <div class="err" id="authErr"></div>
      <button class="btn btn-lime" type="submit" id="authSubmit">登录</button>
      <button class="btn btn-ghost" type="button" id="authSwitch">没有账号？去注册</button>
    </form>
  </section>

  <section id="verify" class="screen auth">
    <div class="brand">
      <div class="kicker">苏轼AI</div>
      <h2>邮箱验证</h2>
      <p class="sub" id="verifySub">验证码已发至邮箱，10 分钟有效。</p>
    </div>
    <form id="verifyForm">
      <div class="field">
        <label>验证码</label>
        <input id="verifyCode" inputmode="numeric" maxlength="6" placeholder="6 位数字" />
      </div>
      <div class="err" id="verifyErr"></div>
      <button class="btn btn-lime" type="submit">确认</button>
      <button class="btn btn-ghost" type="button" id="verifyResend">重发</button>
    </form>
  </section>

  <section id="gen" class="screen app">
    <div class="top">
      <div class="hello">创作工坊</div>
    </div>
    <div class="content gen-wrap" id="genBody" style="padding-bottom: 96px;">
      <div class="card paywall" id="genGate">
        <h3>正在打开工坊…</h3>
      </div>
    </div>
  </section>

  <section id="me" class="screen app">
    <div class="top">
      <div class="hello">我的</div>
    </div>
    <div class="content profile">
      <div class="card">
        <dt>显示名</dt><dd id="meName">—</dd>
        <dt>邮箱</dt><dd id="meEmail">—</dd>
        <dt>方案</dt><dd id="mePlan">—</dd>
        <dt>每日额度</dt><dd id="meQuota">—</dd>
        <dt>会员至</dt><dd id="meVip">—</dd>
        <dt>今日剩余</dt><dd id="meRemain">—</dd>
        <dt>版本</dt><dd id="meVer">1.1.21</dd>
      </div>
      <button class="btn btn-ghost" type="button" id="checkUpdateBtn" style="margin-top:16px;background:var(--card);border:1px solid var(--line);color:var(--text)">检查更新</button>
      <button class="btn btn-ghost" type="button" id="downloadApkBtn" style="margin-top:10px;background:var(--card);border:1px solid var(--line);color:var(--text)">下载安装包</button>
      <button class="btn btn-lime" type="button" id="logoutBtn" style="margin-top:16px;background:#FFF1F2;color:var(--danger)">退出登录</button>
    </div>
  </section>

  <nav class="nav hidden" id="tabbar">
    <button data-tab="gen" class="active">工坊</button>
    <button data-tab="me">我的</button>
  </nav>

  <script>
    const API = location.origin;
    const GEN_URL = '/workshop';
    const $ = (id) => document.getElementById(id);
    let mode = 'login';
    let me = null;
    let genLoaded = false;
    let pendingEmail = '';

    function token() { return localStorage.getItem('sushi_jwt') || ''; }
    function setToken(t) {
      var secure = (location.protocol === 'https:') ? '; Secure' : '';
      if (t) {
        localStorage.setItem('sushi_jwt', t);
        localStorage.setItem('sushi_jwt_at', String(Date.now()));
        // Mirror JWT for workshop iframe cookie fallback; Bearer from localStorage is primary on iOS.
        document.cookie = 'sushi_token=' + t + '; path=/; SameSite=Lax' + secure + '; Max-Age=2592000';
      } else {
        localStorage.removeItem('sushi_jwt');
        localStorage.removeItem('sushi_jwt_at');
        localStorage.removeItem('sushi_me_ok_at');
        document.cookie = 'sushi_token=; path=/; max-age=0; SameSite=Lax' + secure;
      }
    }
    function jwtUnexpired(tok) {
      tok = tok || token();
      if (!tok) return false;
      try {
        var parts = tok.split('.');
        if (parts.length < 2) return !!tok;
        var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var payload = JSON.parse(atob(b64));
        var exp = Number(payload && payload.exp) || 0;
        if (!exp) return true;
        return exp * 1000 > Date.now() + 20000;
      } catch (e) { return !!tok; }
    }
    function sessionFresh() {
      if (!token()) return false;
      if (jwtUnexpired()) return true;
      var at = Number(localStorage.getItem('sushi_me_ok_at') || 0);
      return at && (Date.now() - at < 15 * 60 * 1000);
    }
    function cacheMe(user) {
      me = user;
      try {
        localStorage.setItem('sushi_user', JSON.stringify(user || {}));
        if (user && user.email) localStorage.setItem('sushi_email', user.email);
        localStorage.setItem('sushi_me_ok_at', String(Date.now()));
      } catch (e) {}
    }
    function restoreMe() {
      if (me) return me;
      try {
        var raw = localStorage.getItem('sushi_user');
        if (raw) me = JSON.parse(raw);
      } catch (e) { me = null; }
      return me;
    }
    function workshopUrl(ticket, key, iv) {
      const hash = (key && iv) ? ('#' + key + '.' + iv) : '';
      return '/workshop?k=' + encodeURIComponent(ticket) + hash;
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (token()) headers.Authorization = 'Bearer ' + token();
      const ctrl = opts.signal ? null : new AbortController();
      const to = ctrl ? setTimeout(function () { ctrl.abort(); }, opts.timeoutMs || 10000) : null;
      const res = await fetch(API + path, Object.assign({ credentials: 'include', signal: (opts.signal || (ctrl && ctrl.signal)) }, opts, { headers }));
      if (to) clearTimeout(to);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || '请求失败'), { status: res.status, data });
      return data;
    }

    function showVerify(email) {
      pendingEmail = email;
      $('verifySub').textContent = '验证码已发至 ' + email + '，10 分钟有效。';
      $('verifyCode').value = '';
      $('verifyErr').textContent = '';
      show('verify');
    }

    function show(id) {
      document.querySelectorAll('.screen').forEach((el) => el.classList.remove('on'));
      $(id).classList.add('on');
      const app = ['gen','me'].includes(id);
      $('tabbar').classList.toggle('hidden', !app);
      document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    }

    function renderMe() {
      if (!me) return;
      const vip = me.plan === 'vip';
      $('meName').textContent = me.display_name;
      $('meEmail').textContent = me.email;
      $('mePlan').textContent = vip ? '会员' : '免费';
      $('meQuota').textContent = me.gen_quota_daily;
      $('meVip').textContent = me.vip_until ? String(me.vip_until).slice(0,16).replace('T',' ') : '—';
    }

    async function refreshQuota() {
      const q = await api('/api/me/quota');
      const el = $('meRemain');
      if (el) el.textContent = q.remaining;
      return q;
    }

    async function enterApp() {
      restoreMe();
      if (me) renderMe();
      await enterGen();
    }

    $('authSwitch').onclick = () => {
      mode = mode === 'login' ? 'register' : 'login';
      $('nameField').style.display = mode === 'register' ? 'block' : 'none';
      $('pass2Field').style.display = mode === 'register' ? 'block' : 'none';
      $('authTitle').textContent = mode === 'login' ? '登录' : '注册';
      $('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
      $('authSubmit').disabled = false;
      $('authSubmit').removeAttribute('disabled');
      $('authSwitch').textContent = mode === 'login' ? '没有账号？去注册' : '已有账号，去登录';
      $('authErr').textContent = '';
    };

    $('authForm').onsubmit = async (e) => {
      e.preventDefault();
      $('authErr').textContent = '';
      try {
        if (mode === 'register' && $('password').value !== $('password2').value) {
          $('authErr').textContent = '两次密码不一致';
          return;
        }
        const body = { email: $('email').value, password: $('password').value, display_name: $('displayName').value };
        const path = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
        if (data.need_verify) {
          showVerify(data.email || body.email);
          if (data.mail_sent === false && data.error) {
            $('verifyErr').style.color = 'var(--danger)';
            $('verifyErr').textContent = data.error;
          }
          return;
        }
        setToken(data.token);
        cacheMe(data.user);
        renderMe();
        refreshQuota().catch(function () {});
        await enterApp();
      } catch (err) {
        if (err.data && err.data.need_verify) {
          showVerify($('email').value.trim().toLowerCase());
          return;
        }
        $('authErr').textContent = err.message;
      }
    };

    $('verifyForm').onsubmit = async (e) => {
      e.preventDefault();
      $('verifyErr').textContent = '';
      try {
        const data = await api('/api/auth/verify', {
          method: 'POST',
          body: JSON.stringify({ email: pendingEmail, code: $('verifyCode').value.trim() }),
        });
        setToken(data.token);
        cacheMe(data.user);
        renderMe();
        refreshQuota().catch(function () {});
        await enterApp();
      } catch (err) {
        $('verifyErr').textContent = err.message;
      }
    };

    $('verifyResend').onclick = async () => {
      $('verifyErr').textContent = '';
      try {
        const data = await api('/api/auth/resend', { method: 'POST', body: JSON.stringify({ email: pendingEmail }) });
        if (data.mail_sent === false && data.error) {
          $('verifyErr').style.color = 'var(--danger)';
          $('verifyErr').textContent = data.error;
        } else {
          $('verifyErr').textContent = '已重新发送';
          $('verifyErr').style.color = 'var(--muted)';
        }
      } catch (err) {
        $('verifyErr').style.color = 'var(--danger)';
        $('verifyErr').textContent = err.message;
      }
    };

    $('logoutBtn').onclick = () => { setToken(''); me = null; genLoaded = false; show('auth'); };
    var chk = $('checkUpdateBtn');
    if (chk) chk.onclick = async function () {
      try {
        const v = await api('/api/app/version');
        const code = Number(v.versionCode || 0);
        alert(code > 14 ? ('发现新版本 ' + (v.versionName || '')) : '已是最新版本');
      } catch (e) { alert('暂时无法连接'); }
    };
    var dl = $('downloadApkBtn');
    if (dl) dl.onclick = function () { location.href = '/api/app/download'; };

    document.querySelectorAll('.nav button').forEach((btn) => {
      btn.onclick = async () => {
        const tab = btn.dataset.tab;
        if (tab === 'gen') await enterGen();
        else show(tab);
      };
    });

    async function enterGen() {
      show('gen');
      const body = $('genBody');
      if (genLoaded) {
        try {
          var p = localStorage.getItem('sushi_pending_prompt');
          var iframe = body.querySelector('iframe');
          if (p && iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'sushi_prompt', prompt: p }, '*');
          }
        } catch (e) {}
        return;
      }
      // Logged-in web: open /workshop with auth cookie — server serves workshop.html
      // directly (no AES ticket / cross-instance unlock). Keep ticket+postMessage
      // only as a fallback if the auth path fails (e.g. cookie missing).
      body.innerHTML = '<div class="card paywall" id="genGate"><h3>正在打开工坊…</h3><p class="muted" id="genGateDetail" style="margin:8px 0 0">正在载入创作页，请稍候。</p></div>';
      try {
        body.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = '/workshop';
        iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
        iframe.style.borderRadius = '12px';
        iframe.addEventListener('load', function () {
          try {
            var doc = iframe.contentDocument;
            if (doc && doc.getElementById('loaderTitle') && /未能打开/.test(doc.getElementById('loaderTitle').textContent || '')) {
              genLoaded = false;
            }
          } catch (e) {}
          try {
            var tok = token();
            if (tok && iframe.contentWindow) {
              iframe.contentWindow.postMessage({ type: 'sushi_auth', token: tok }, location.origin);
            }
          } catch (e2) {}
        });
        body.appendChild(iframe);
        genLoaded = true;
        refreshQuota().catch(function () {});
      } catch (err) {
        // Fallback: legacy encrypted ticket path + postMessage for Safari iframe.
        try {
          const ctrl = new AbortController();
          const to = setTimeout(function () { ctrl.abort(); }, 60000);
          const wrap = await api('/api/workshop/ticket', { method: 'POST', body: '{}', signal: ctrl.signal, timeoutMs: 60000 });
          clearTimeout(to);
          try {
            sessionStorage.setItem('sushi_wrap_key', wrap.key);
            sessionStorage.setItem('sushi_wrap_iv', wrap.iv);
            sessionStorage.setItem('sushi_wrap_ticket', wrap.ticket);
          } catch (e) {}
          body.innerHTML = '';
          const iframe = document.createElement('iframe');
          iframe.src = workshopUrl(wrap.ticket, wrap.key, wrap.iv);
          iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
          iframe.style.borderRadius = '12px';
          iframe.addEventListener('load', function () {
            try {
              iframe.contentWindow.postMessage({
                type: 'sushi_wrap_unlock',
                key: wrap.key,
                iv: wrap.iv,
                ticket: wrap.ticket
              }, '*');
            } catch (e) {}
          });
          body.appendChild(iframe);
          // Also post shortly after insert in case load already fired.
          setTimeout(function () {
            try {
              iframe.contentWindow && iframe.contentWindow.postMessage({
                type: 'sushi_wrap_unlock',
                key: wrap.key,
                iv: wrap.iv,
                ticket: wrap.ticket
              }, '*');
            } catch (e) {}
          }, 50);
          genLoaded = true;
          refreshQuota().catch(function () {});
          return;
        } catch (err2) {
          err = err2;
        }
        genLoaded = false;
        const pay = err.status === 402;
        const abort = err && (err.name === 'AbortError' || /aborted|abort/i.test(String(err.message || '')));
        body.innerHTML = '<div class="card paywall"><h3>' +
          (pay ? '今日次数已用尽' : (abort ? '打开工坊超时' : err.message)) +
          '</h3><p class="muted" style="margin:8px 0 18px">' +
          (abort ? '冷启动较慢时可能超时，请再点一次重试。' : '请稍后重试进入创作。') +
          '</p><button class="btn btn-lime" type="button" id="retryGen">重试</button></div>';
        const r = $('retryGen');
        if (r) r.onclick = function () { genLoaded = false; enterGen(); };
      }
    }

    async function bootSession() {
      restoreMe();
      if (me) renderMe();
      await enterGen();
    }

    setTimeout(async () => {
      if (!token()) { show('auth'); return; }
      restoreMe();
      if (me) renderMe();
      if (sessionFresh()) {
        await enterGen();
        bootSession().catch(function () {});
        return;
      }
      try { await bootSession(); } catch { await enterGen(); }
    }, 200);
  </script>
</body>
</html>
